name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for sounddevice wheels
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check core tests
      - name: Tests
        run: pytest -q

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
